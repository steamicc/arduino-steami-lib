name: Build

# Reusable workflow, called by ci.yml: PlatformIO build, then the examples
# chosen by scripts/exemples-concernes.py.

on:
  workflow_call:
    inputs:
      exemples:
        description: 'JSON array of lib/<driver>/examples/<example> folders to compile, "" for all'
        required: true
        type: string
      empreinte:
        description: 'Check the flash and RAM footprint (scripts/check-footprint.py)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/steami.json', 'requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-

      # Node and the lint tools are not needed here, PlatformIO is.
      - name: Setup dev environment
        run: make install-pio

      - name: Build project
        run: make build

      # ci.yml never passes an empty list: it skips this workflow instead.
      - name: Compile examples
        env:
          EXEMPLES: ${{ inputs.exemples }}
        run: |
          set -euo pipefail
          if [ -z "$EXEMPLES" ]; then
            make test-examples
          else
            jq -r '.[]' <<< "$EXEMPLES" > "$RUNNER_TEMP/exemples.txt"
            .venv/bin/python3 scripts/test-examples.py --only "$RUNNER_TEMP/exemples.txt"
          fi

      - name: Check the flash and RAM footprint
        if: ${{ inputs.empreinte }}
        run: .venv/bin/python3 scripts/check-footprint.py
