name: Examples archive

# Build the archive of compiled examples (steami-exemples-<tag>.zip: index.json
# plus one .bin per example) and attach it to the release <tag> of
# steamicc/arduino-steami. Called by publish-arduino-package.yml once the
# package is published, and runnable by hand on an existing tag (backfill):
#   gh workflow run examples-archive.yml -f tag=v0.34.0
#
# The scripts that compile and archive come from the ref the workflow runs on
# (the tag when called by the publication; the dispatched ref is main for a
# backfill, any other ref is refused); the package is built with the builder
# of the tag, checked out in tagged/ (the repository already has a src/
# directory). An archive already attached to the release is never replaced.
# The zip is always uploaded as a workflow artifact before any write; a manual
# run with dry_run stops there.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string
      dry_run:
        description: 'Build the archive and upload it as a workflow artifact, write nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: examples-archive-${{ inputs.tag }}
  cancel-in-progress: false

env:
  STM32_CORE_VERSION: '3.1.0'
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
  DIST_REPO: steamicc/arduino-steami

jobs:
  examples-archive:
    name: Build and attach the examples archive
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Validate the tag and the ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (got '$REF'): the scripts come from the dispatched ref"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG': expected vX.Y.Z"
            exit 1
          fi

      - name: Check that the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$DIST_REPO" > /dev/null; then
            echo "::error::Cannot read release ${TAG} in ${DIST_REPO} (missing release or no access)"
            exit 1
          fi

      - name: Checkout the scripts
        uses: actions/checkout@v4

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: tagged

      - name: Build the package
        run: python3 tagged/scripts/build-arduino-package.py --version "${TAG#v}" --out build/arduino-package

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install the STM32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "STMicroelectronics:stm32@${STM32_CORE_VERSION}"

      - name: Install library dependencies
        run: arduino-cli lib install STM32duinoBLE

      - name: Compile every example
        run: scripts/compile-package-examples.sh build/arduino-package --output-dir build/exemples-bin

      - name: Build the archive
        run: python3 scripts/build-examples-archive.py --pkg build/arduino-package --bins build/exemples-bin --tag "$TAG" --coeur "$STM32_CORE_VERSION" --out "steami-exemples-${TAG}.zip"

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: steami-exemples-${{ inputs.tag }}
          path: steami-exemples-${{ inputs.tag }}.zip
          if-no-files-found: error

      - name: Generate token
        if: ${{ !inputs.dry_run }}
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.RELEASE_APP_ID }}
          private_key: ${{ secrets.RELEASE_APP_SECRET }}
          repositories: >-
            ["arduino-steami"]

      - name: Attach the archive to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail
          asset="steami-exemples-${TAG}.zip"
          if ! assets="$(gh release view "$TAG" -R "$DIST_REPO" --json assets --jq '.assets[].name')"; then
            echo "::error::Cannot read release ${TAG} in ${DIST_REPO} (missing release or no access)"
            exit 1
          fi
          if grep -qxF "$asset" <<< "$assets"; then
            echo "::notice::${asset} is already attached to ${TAG} in ${DIST_REPO}: nothing written."
            exit 0
          fi
          gh release upload "$TAG" "$asset" -R "$DIST_REPO"
