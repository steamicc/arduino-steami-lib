name: Examples archive

# Build the archive of compiled examples (steami-exemples-<tag>.zip: index.json
# plus one .bin per example) and attach it to the DRAFT release <tag> of
# steamicc/arduino-steami. The organization enforces immutable releases there:
# once a release is published, no asset can be added, so the archive can only be
# attached while the release is a draft. publish-arduino-package.yml creates the
# draft, calls this workflow, then publishes the draft.
#
# The examples are compiled once per publication: publish-arduino-package.yml
# passes `artefacts: true`, and this workflow downloads the package
# (arduino-package) and the .bin files (exemples-bin) that its check job
# uploaded in the same run. It then installs no toolchain and compiles nothing.
#
# Manual run (fallback, e.g. retry of a failed attach on a draft release; main
# only): it has no `artefacts` input, so it builds the package and compiles
# every example itself:
#   gh workflow run examples-archive.yml -f tag=<tag> [-f dry_run=true]
# A release that is already published cannot be backfilled.
#
# The scripts that compile and archive come from the ref the workflow runs on
# (the tag when called by the publication; main for a direct run, any other ref
# is refused); without artefacts, the package is built with the builder of the
# tag, checked out in tagged/ (the repository already has a src/ directory),
# as the check job of the publication builds it. An archive already
# attached and fully uploaded (state "uploaded") is never replaced; one left in
# another state by an interrupted upload is deleted and uploaded again. Every
# upload is checked against the local zip (state, size, SHA-256 digest): on a
# mismatch the asset is deleted and the job fails, so the draft is not published.
# The zip is always uploaded as a workflow artifact before any write; a manual
# run with dry_run stops there.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string
      depuis_publication:
        description: 'Set by publish-arduino-package.yml (skips the main-only guard)'
        required: false
        type: boolean
        default: false
      artefacts:
        description: 'Reuse the arduino-package and exemples-bin artifacts of the run instead of compiling'
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string
      dry_run:
        description: 'Build the archive and upload it as a workflow artifact, write nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: examples-archive-${{ inputs.tag }}
  cancel-in-progress: false

env:
  STM32_CORE_VERSION: '3.1.0'
  # Pinned so the compiled examples do not change with each STM32duinoBLE
  # release. Keep equal to the lower bound of stm32duino/STM32duinoBLE in
  # platformio.ini (checked by scripts/tests/test_workflow_versions.py).
  STM32DUINOBLE_VERSION: '1.5.0'
  # Pinned as in ci.yml, whose caches job saves the ~/.arduino15 cache.
  ARDUINO_CLI_VERSION: '1.6.0'
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
  DIST_REPO: steamicc/arduino-steami

jobs:
  examples-archive:
    name: Build and attach the examples archive
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Validate the tag and the ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FROM_PUBLICATION: ${{ inputs.depuis_publication && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Under workflow_call, event_name and ref are the caller's: the
          # main-only guard applies to direct manual runs only.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FROM_PUBLICATION" != "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (got '$REF'): the scripts come from the dispatched ref"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG': expected vX.Y.Z"
            exit 1
          fi

      # The app token is needed early: the default token cannot see the drafts
      # of another repository. It lasts one hour, longer than the compilation.
      # It reads the draft, then uploads or deletes the archive.
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: steamicc
          repositories: arduino-steami
          permission-contents: write

      - name: Check that the release is a draft
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if ! is_draft="$(gh release view "$TAG" -R "$DIST_REPO" --json isDraft --jq '.isDraft')"; then
            echo "::error::Cannot read release ${TAG} in ${DIST_REPO} (missing release or no access)"
            exit 1
          fi
          if [ "$is_draft" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Release ${TAG} in ${DIST_REPO} is already published: releases are immutable, no asset can be added. Only a draft release can receive the archive."
            exit 1
          fi

      - name: Checkout the scripts
        uses: actions/checkout@v4

      # Without artefacts only (manual run): the steps down to the compilation
      # build the package and the .bin files that the publication's check job
      # otherwise uploads.
      - name: Checkout the tag
        if: ${{ !inputs.artefacts }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: tagged

      - name: Build the package
        if: ${{ !inputs.artefacts }}
        run: python3 tagged/scripts/build-arduino-package.py --version "${TAG#v}" --out build/arduino-package

      # Saved on main by the caches job of ci.yml (same key and paths), never
      # here: on a miss, the core and the library are installed below.
      - name: Restore the Arduino toolchain
        if: ${{ !inputs.artefacts }}
        id: arduino15
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries/STM32duinoBLE
          key: arduino15-${{ runner.os }}-cli${{ env.ARDUINO_CLI_VERSION }}-stm32-${{ env.STM32_CORE_VERSION }}-ble${{ env.STM32DUINOBLE_VERSION }}

      - name: Install Arduino CLI
        if: ${{ !inputs.artefacts }}
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Install the STM32 core
        if: ${{ !inputs.artefacts && steps.arduino15.outputs.cache-hit != 'true' }}
        run: |
          arduino-cli core update-index
          arduino-cli core install "STMicroelectronics:stm32@${STM32_CORE_VERSION}"

      - name: Install library dependencies
        if: ${{ !inputs.artefacts && steps.arduino15.outputs.cache-hit != 'true' }}
        run: arduino-cli lib install "STM32duinoBLE@${STM32DUINOBLE_VERSION}"

      - name: Compile every example
        if: ${{ !inputs.artefacts }}
        run: scripts/compile-package-examples.sh build/arduino-package --output-dir build/exemples-bin

      # With artefacts (publication): the package and the .bin files of the
      # check job. The archive script fails if an example has no .bin.
      - name: Download the package
        if: ${{ inputs.artefacts }}
        uses: actions/download-artifact@v4
        with:
          name: arduino-package
          path: build/arduino-package

      - name: Download the compiled examples
        if: ${{ inputs.artefacts }}
        uses: actions/download-artifact@v4
        with:
          name: exemples-bin
          path: build/exemples-bin

      - name: Build the archive
        run: python3 scripts/build-examples-archive.py --pkg build/arduino-package --bins build/exemples-bin --tag "$TAG" --coeur "$STM32_CORE_VERSION" --out "steami-exemples-${TAG}.zip"

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: steami-exemples-${{ inputs.tag }}
          path: steami-exemples-${{ inputs.tag }}.zip
          if-no-files-found: error

      - name: Attach the archive to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail
          export ASSET="steami-exemples-${TAG}.zip"
          # State of the archive already attached, empty if there is none.
          # "uploaded" means complete; an interrupted upload leaves another
          # state (e.g. "starter") and an unusable asset.
          if ! state="$(gh release view "$TAG" -R "$DIST_REPO" --json assets --jq '.assets[] | select(.name == env.ASSET) | .state')"; then
            echo "::error::Cannot read release ${TAG} in ${DIST_REPO} (missing release or no access)"
            exit 1
          fi
          if [ "$state" = "uploaded" ]; then
            echo "::notice::${ASSET} is already attached to ${TAG} in ${DIST_REPO}: nothing written."
            exit 0
          fi
          if [ -n "$state" ]; then
            echo "::warning::${ASSET} is attached to ${TAG} in ${DIST_REPO} in state '${state}' (incomplete upload): deleted and uploaded again."
            gh release delete-asset "$TAG" "$ASSET" -R "$DIST_REPO" --yes
          fi
          gh release upload "$TAG" "$ASSET" -R "$DIST_REPO"

          # Check what GitHub stored against the local file.
          size="$(stat -c %s "$ASSET")"
          sha="$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
          remote="$(gh release view "$TAG" -R "$DIST_REPO" --json assets \
            --jq '.assets[] | select(.name == env.ASSET) | "\(.state) \(.size) \(.digest // "")"')"
          read -r r_state r_size r_digest <<< "$remote"
          if [ "${r_state:-}" != "uploaded" ] || [ "${r_size:-}" != "$size" ] \
            || { [ -n "${r_digest:-}" ] && [ "$r_digest" != "sha256:${sha}" ]; }; then
            echo "::error::${ASSET} on ${TAG} in ${DIST_REPO} does not match the local archive (state '${r_state:-missing}', size ${r_size:-none} for ${size}, digest '${r_digest:-none}' for sha256:${sha}). The faulty asset is deleted: re-run this job."
            gh release delete-asset "$TAG" "$ASSET" -R "$DIST_REPO" --yes || true
            exit 1
          fi
          if [ -z "${r_digest:-}" ]; then
            echo "::warning::GitHub gave no digest for ${ASSET}: checked on state and size only."
          fi
          echo "::notice::${ASSET} attached to ${TAG} in ${DIST_REPO} (${size} bytes, sha256:${sha})."
