name: Publish Arduino package

# On each release tag, publish the STeaMi Arduino library to
# steamicc/arduino-steami (the repository registered in the Arduino Library
# Manager) and attach STeaMi-X.Y.Z.zip to the release of this repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.25.0)'
        required: true
        type: string
      dry_run:
        description: 'Print what would be pushed and stop before any write'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-arduino-package
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate the tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$tag': expected vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  check:
    name: Check the package
    needs: resolve
    uses: ./.github/workflows/arduino-package-check.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: refs/tags/${{ needs.resolve.outputs.tag }}

  publish:
    name: Publish the package
    needs: [resolve, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      DIST_REPO: steamicc/arduino-steami
      SOURCE_REPO: steamicc/arduino-steami-lib
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: arduino-package
          path: package

      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.RELEASE_APP_ID }}
          private_key: ${{ secrets.RELEASE_APP_SECRET }}
          repositories: >-
            ["arduino-steami", "arduino-steami-lib"]

      - name: Push the package to the distribution repository
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${DIST_REPO}.git" dist
          cd dist
          git config user.name "semantic-release-updater[bot]"
          git config user.email "semantic-release-updater[bot]@users.noreply.github.com"

          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists in ${DIST_REPO}: nothing to push."
            exit 0
          fi

          # Replace everything but .git with the package.
          find . -mindepth 1 -maxdepth 1 -name .git -prune -o -exec rm -rf {} +
          cp -a ../package/. .
          git checkout -B main
          git add --all

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would commit 'Release ${TAG}', tag ${TAG} and push main."
            git status --short | head -50
            exit 0
          fi

          # --allow-empty keeps a release commit even if the content is unchanged.
          git commit --allow-empty -m "Release ${TAG}"
          git tag "${TAG}"
          git push origin main
          git push origin "${TAG}"

      - name: Ensure the release in the distribution repository
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$DIST_REPO" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${DIST_REPO}."
          else
            gh release create "$TAG" -R "$DIST_REPO" --verify-tag --title "$TAG" \
              --notes "Arduino package of the STeaMi drivers. Release notes: https://github.com/${SOURCE_REPO}/releases/tag/${TAG}"
          fi

      - name: Attach the ZIP to the release of this repository
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p zip/STeaMi
          cp -a package/. zip/STeaMi/
          (cd zip && zip -qr "../STeaMi-${VERSION}.zip" STeaMi)
          gh release upload "$TAG" "STeaMi-${VERSION}.zip" --clobber -R "$SOURCE_REPO"

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run: no commit, tag, release or ZIP was written."
          echo "Would publish ${TAG} (version ${VERSION}) to ${DIST_REPO} and upload STeaMi-${VERSION}.zip to ${SOURCE_REPO}."
