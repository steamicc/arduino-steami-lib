name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One semantic-release at a time: two runs in parallel push to main and race
# on the release commit and tag ("cannot lock ref"). A newer push replaces the
# pending run, which loses no release: the newer run analyses every commit
# since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # semantic-release pushes the release commit and tag to main and creates
      # the release (contents), then comments on and labels the released
      # issues and pull requests (issues, pull-requests). Limited to this
      # repository: checkout keeps the token in the git config while npm ci
      # runs.
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: steamicc
          repositories: arduino-steami-lib
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          HUSKY: "0"
        run: npx semantic-release
