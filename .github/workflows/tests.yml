name: Tests

# Reusable workflow, called by ci.yml on every PR, in the merge queue and on
# main.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The packaging and CI tooling (scripts/tests), on every PR: the
  # arduino-package job of ci.yml, which also runs them, is often skipped.
  tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test the tooling
        run: python3 -m unittest discover -s scripts/tests

  native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/steami.json', 'requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Run native tests
        run: make test-native

  display-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/steami.json', 'requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Run the display suites under ASan and UBSan
        env:
          STEAMI_PPM_DIR: ${{ runner.temp }}/steami-display-ppm
        run: |
          mkdir -p "$STEAMI_PPM_DIR"
          make install-pio
          .venv/bin/pio test -e native_asan

      - name: Upload the primitives gallery
        uses: actions/upload-artifact@v4
        with:
          name: steami-display-gallery
          path: ${{ runner.temp }}/steami-display-ppm
          if-no-files-found: error

      - name: Check the 128 px renders are unchanged
        env:
          STEAMI_PPM_DIR: ${{ runner.temp }}/steami-display-ppm
        run: cd "$STEAMI_PPM_DIR" && sha256sum -c "$GITHUB_WORKSPACE/tests/native/test_steami_display/ppm-128.sha256"

  mockup-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout the tutorials mockups
        uses: actions/checkout@v4
        with:
          repository: steamicc/micropython-steami-tutorials
          ref: 83d8e2ca23abb0eeca7afca2d001cdd95b1df76b
          sparse-checkout: docs/mockups
          path: tutorials

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/steami.json', 'requirements.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Render the mockups
        env:
          STEAMI_PPM_DIR: ${{ runner.temp }}/steami-mockups
        run: |
          mkdir -p "$STEAMI_PPM_DIR"
          make install-pio
          .venv/bin/pio test -e native -f native/test_steami_screen_mockups

      - name: Score them against the tutorials
        continue-on-error: true
        run: |
          python -m pip install pillow==12.1.1 numpy==2.3.5
          python scripts/mockup-review.py --ppm-dir "${{ runner.temp }}/steami-mockups" --refs tutorials/docs/mockups --out "${{ runner.temp }}/steami-mockup-review"
          { echo '```'; cat "${{ runner.temp }}/steami-mockup-review/ssim.csv"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the mockup review page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steami-mockup-review
          path: ${{ runner.temp }}/steami-mockup-review
          if-no-files-found: warn
