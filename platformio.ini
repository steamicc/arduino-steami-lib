[platformio]
default_envs = steami
test_dir = tests

[env:steami]
platform = ststm32@^20
; STM32duino 3.1.0, the core the Arduino IDE installs for the STeaMi board.
; Core 2.x capped TwoWire::requestFrom() at 255 bytes, too short for the
; 256-byte blocks of the DAPLink bridge.
platform_packages =
  platformio/framework-arduinoststm32@~4.30100.0
board = steami
framework = arduino
monitor_speed = 115200
test_framework = unity
test_filter =
  hardware/test_*
  integration/test_*
build_flags =
  -I tests/shared
  ; STM32duino 3.x defines the _write() syscall, weak, in Print.cpp. A test
  ; that never prints but parses numbers (strtod -> assert -> fprintf) needs
  ; _write without pulling Print.cpp in, and fails to link.
  -Wl,-u,_write
; Third-party dependency of the lib/ble examples (not a STeaMi driver).
lib_deps =
  stm32duino/STM32duinoBLE@^1.5.0

[env:native]
platform = native
test_framework = unity
test_filter = native/test_*
lib_compat_mode = off
build_flags =
  -std=c++17
  -D UNIT_TEST
  -I tests/native/helpers
  -I tests/shared

[env:native_asan]
; The display and screen suites under AddressSanitizer and UndefinedBehaviorSanitizer.
; SCons passes -fsanitize to both the compiler and the linker.
extends = env:native
test_filter =
  native/test_steami_display*
  native/test_steami_screen*
build_flags =
  ${env:native.build_flags}
  -fsanitize=address,undefined
  -fno-sanitize-recover=all
  -fno-omit-frame-pointer
