sentence=BME280 pressure, humidity and temperature sensor driver for the STeaMi V1c board.
paragraph=Arduino-compatible driver for the Bosch BME280 I2C pressure + humidity + temperature sensor. Exposes the STeaMi driver collection API (begin, deviceId, temperature, humidity, pressureHpa, read, setContinuous, triggerOneShot, readOneShot, setOversampling, setIirFilter) plus altitude, dewPoint and user calibration hooks (setTemperatureOffset, calibrateTemperature).
