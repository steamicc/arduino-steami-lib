sentence=IMP34DT05 PDM digital microphone driver for the STeaMi board.
paragraph=Arduino driver for the STMicroelectronics IMP34DT05 MEMS microphone of the STeaMi board, read through the PDM interface of the STM32WB55 SAI1 with DMA. Delivers 16 kHz 16-bit PCM samples (read, available, onReceive), a volume setting, the sound level (rms, peak, levelDbfs, levelDbSpl) and the dominant frequency (dominantFrequencyHz). The PDM to PCM filter is ported from ST's X-NUCLEO-IKS02A1-Audio library (BSD-3-Clause).
category=Sensors
url=https://github.com/steamicc/arduino-steami-lib
architectures=*
includes=SteamiIMP34DT05.h
