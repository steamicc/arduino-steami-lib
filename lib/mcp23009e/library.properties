sentence=MCP23009E 8-bit I2C I/O expander driver for the STeaMi board.
paragraph=Arduino-compatible driver for the Microchip MCP23009E I/O expander that drives the STeaMi D-PAD and the croc-connector GPIOs. Exposes the STeaMi driver collection API (begin, reset, powerOn, powerOff, setup, setLevel, getLevel, register accessors, interruptOnChange / interruptOnFalling / interruptOnRaising) plus MCP23009Pin / MCP23009ActiveLowPin helper classes that mirror the MicroPython Pin API.
